<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<!-- Responsive viewport for true auto adjustment -->
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes">
<title>LM0702</title><link rel="icon" href="lm0702.jpeg" type="image/jpeg">
<meta property="og:image" content="Decor.jpeg"><link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500&family=Playfair+Display:wght@500&display=swap" rel="stylesheet">
<style>
  /* ----- base reset + remove blue tap ----- */
  *{
    margin:0;
    padding:0;
    box-sizing:border-box;
    /* no more blue highlight on tap */
    -webkit-tap-highlight-color: transparent;
    -webkit-touch-callout: none;
    -webkit-user-select: none;
    -khtml-user-select: none;
    -moz-user-select: none;
    -ms-user-select: none;
    user-select: none;
  }

  /* allow text selection inside bio if needed (bio removed but keeping style definition just in case) */
  .bio {
    user-select: text;
    -webkit-user-select: text;
    -moz-user-select: text;
    -ms-user-select: text;
  }

  body,html{
    height:100%;
    width:100%;
    overflow:hidden;
    color:white;
    font-family: 'Poppins', sans-serif;
  }

  /* ----- video background: less blur + always cover any screen ----- */
  .video-bg{
    position:fixed;
    top: 50%;
    left: 50%;
    min-width:100%;
    min-height:100%;
    width: auto;
    height: auto;
    transform: translate(-50%, -50%) scale(1.02);
    object-fit: cover;           /* perfect fit on all resolutions */
    filter: blur(0.8px) brightness(0.85);  /* reduced blur (was 2px) */
    z-index:-2;
  }

  .overlay{
    position:fixed;
    width:100%;
    height:100%;
    backdrop-filter: blur(2px);   /* softer overlay blur (was 4px) – keeps readability but lighter */
    background: linear-gradient(to bottom, rgba(0,0,0,0.15), rgba(0,0,0,0.4)); /* slightly lighter */
    z-index:-1;
  }

  /* ----- main container – fully fluid, smooth, auto-everything ----- */
  .container{
    height: 100vh;
    height: 100dvh;              /* dynamic for mobile */
    width: 100%;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:flex-start;  /* keeps top alignment as original */
    padding: clamp(40px, 8vh, 75px) 5% 0 5%;  /* responsive top padding */
    text-align:center;
    overflow-y:auto;
    scrollbar-width: thin;
    scrollbar-color: rgba(255,255,255,0.2) transparent;
  }

  .container::-webkit-scrollbar {
    width: 5px;
  }
  .container::-webkit-scrollbar-thumb {
    background: rgba(255,255,255,0.2);
    border-radius: 20px;
  }

  /* profile picture – keeps original 185px but scales on tiny screens */
  .profile{
    width: min(185px, 60vw);
    height: min(185px, 60vw);
    max-width: 200px;
    max-height: 200px;
    border-radius:50%;
    overflow:hidden;
    border:2px solid rgba(255,255,255,0.5);
    box-shadow:0 10px 40px rgba(0,0,0,0.35);
    backdrop-filter: blur(10px);
    transition: transform 0.3s ease;
    flex-shrink:0;
  }

  .profile:hover{
    transform: scale(1.06);
  }
  .profile:active{
    transform: scale(0.92);
  }

  .profile img{
    width:100%;
    height:100%;
    object-fit:cover;
    display:block;
  }

  /* name – fluid between 28px and 42px */
  .name{
    margin-top: clamp(12px, 3vh, 20px);
    font-family:'Playfair Display', serif;
    font-size: clamp(28px, 8vw, 42px);
    letter-spacing:1.2px;
    text-shadow:0 4px 18px rgba(0,0,0,0.45);
    line-height:1.2;
    word-break:break-word;
  }

  /* social icons wrapper – now holds only Tiktok and Instagram (telegram, whatsapp, discord removed) */
  .socials{
    margin-top: clamp(16px, 3vh, 22px);
    display:flex;
    gap: clamp(16px, 4vw, 26px);
    flex-wrap:wrap;
    justify-content:center;
    align-items:center;
    padding:0 8px;
  }

  .socials a{
    width: clamp(52px, 12vw, 62px);
    height: clamp(52px, 12vw, 62px);
    display:flex;
    align-items:center;
    justify-content:center;
    border-radius:50%;
    background:rgba(255,255,255,0.12);
    backdrop-filter: blur(14px);
    border:1px solid rgba(255,255,255,0.35);
    color:white;
    font-size: clamp(22px, 5vw, 28px);
    text-decoration:none;
    box-shadow:0 6px 18px rgba(0,0,0,0.25);
    transition: all 0.25s ease;
  }

  .socials a:hover{
    transform: scale(1.12);
    background:rgba(255,255,255,0.25);
  }
  .socials a:active{
    transform: scale(0.85);
  }

  /* ----- section heading for "My best Hosts" – COMPLETELY REMOVED (not used) ----- */
  /* .hosts-heading removed as per requirement */

  /* ----- row for Kate, Zara and Gift Gallery – COMPLETELY REMOVED as per "remove best host part" ----- */
  /* .kate-zara-row and .kate-zara-btn styles removed */

  /* bio – COMPLETELY REMOVED as per "about me" removal */
  /* .bio styles removed */

  /* ----- contacts & review button (placed before footer) ----- */
  .contact-review-wrapper {
    margin-top: clamp(24px, 4vh, 35px);
    margin-bottom: clamp(30px, 5vh, 45px);  /* creates space before footer */
    width: 100%;
    display: flex;
    justify-content: center;
    align-items: center;
  }

  .contact-review-btn {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    background: rgba(255,255,255,0.12);
    backdrop-filter: blur(14px);
    border: 1px solid rgba(255,255,255,0.35);
    border-radius: 60px;          /* extra pill shape */
    padding: clamp(12px, 2.5vh, 18px) clamp(28px, 6vw, 50px);
    color: white;
    font-size: clamp(18px, 4.5vw, 24px);
    font-weight: 500;
    font-family: 'Poppins', sans-serif;
    letter-spacing: 1.2px;
    text-transform: uppercase;
    text-decoration: none;
    box-shadow: 0 8px 25px rgba(0,0,0,0.3);
    transition: all 0.3s ease;
    white-space: nowrap;
    line-height: 1.2;
    gap: 10px;
    cursor: pointer;
    border: 1px solid rgba(255,255,255,0.3);
  }

  .contact-review-btn:hover {
    transform: scale(1.06);
    background: rgba(255,255,255,0.22);
    box-shadow: 0 12px 30px rgba(0,0,0,0.4);
  }

  .contact-review-btn:active {
    transform: scale(0.94);
  }

  /* optional icon inside button (can be added via html) */
  .contact-review-btn i {
    font-size: 1.2em;
  }

  /* footer – always visible, adaptive font */
  .footer{
    position:fixed;
    bottom: clamp(8px, 2vh, 12px);
    width:100%;
    text-align:center;
    font-size: clamp(12px, 3.5vw, 15px);
    letter-spacing:1px;
    opacity:0.85;
    font-family:'Playfair Display', serif;
    text-shadow:0 2px 10px rgba(0,0,0,0.5);
    pointer-events:none;
    padding:0 5px;
  }

  .footer span{
    opacity:0.9;
    display:inline-block;
  }

  /* ----- special tuning for very short / landscape devices ----- */
  @media (max-height: 600px) and (orientation: landscape) {
    .container {
      padding-top: 15px;
    }
    .profile {
      width: 130px;
      height: 130px;
    }
    .name {
      margin-top: 6px;
      font-size: 26px;
    }
    .socials {
      margin-top: 10px;
      gap: 16px;
    }
    .contact-review-wrapper {
      margin-top: 15px;
      margin-bottom: 40px; /* ensure footer space */
    }
    .contact-review-btn {
      padding: 8px 30px;
      font-size: 18px;
    }
  }

  /* for very narrow phones (< 360px) */
  @media (max-width: 360px) {
    .profile {
      width: 150px;
      height: 150px;
    }
    .socials a {
      width: 50px;
      height: 50px;
      font-size: 22px;
    }
    .contact-review-btn {
      padding: 10px 25px;
      font-size: 16px;
    }
  }

  /* for very tall screens: vertical center look (optional, keeps original top but feels balanced) */
  @media (min-height: 900px) {
    .container {
      justify-content: center;   /* slightly more elegant on big screens */
      padding-top: 2vh;
    }
  }
</style>
</head>
<body>
<video autoplay muted loop class="video-bg">
  <source src="Decor.mp4" type="video/mp4">
</video>
<div class="overlay"></div>
<div class="container">
  <div class="profile">
    <img src="lm0702.jpeg" alt="Profile">
  </div>
  <div class="name">lm0702</div>
  
  <!-- First row: social icons (only Tiktok and Instagram kept; Telegram, WhatsApp, Discord removed) -->
  <div class="socials">
    <a href="https://www.tiktok.com/@lm0702_" target="_blank">
      <i class="fa-brands fa-tiktok"></i>
    </a>
    <a href="https://www.instagram.com/lm0702_" target="_blank">
      <i class="fa-brands fa-instagram"></i>
    </a>
    <!-- Telegram icon removed -->
    <!-- WhatsApp icon removed -->
    <!-- Discord icon removed -->
  </div>

  <!-- "My best Hosts" heading completely removed -->
  <!-- Second row (Kate, Zara and Gift Gallery buttons) completely removed as per "remove best host part" -->

  <!-- Bio section (about me) completely removed -->

  <!-- Contacts & Review button linked to Contact.html (kept unchanged) -->
  <div class="contact-review-wrapper">
    <a href="Contact.html" class="contact-review-btn" target="_self">
      <i class="fa-regular fa-star" style="margin-right: 8px;"></i> Contacts & Review
    </a>
  </div>

</div> <!-- end container -->

<div class="footer">
  © <span>LM0702</span>
</div>

</body>
</html>
